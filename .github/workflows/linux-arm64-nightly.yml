name: Linux ARM64 Nightly

on:
  schedule:
    - cron: "37 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-arm64-nightly
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve upstream nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.nightly.outputs.tag }}
      version: ${{ steps.nightly.outputs.version }}
      published_at: ${{ steps.nightly.outputs.published_at }}
      release_tag: ${{ steps.nightly.outputs.release_tag }}
      artifact_name: ${{ steps.nightly.outputs.artifact_name }}
      arch_pkgver: ${{ steps.nightly.outputs.arch_pkgver }}
      package_name: ${{ steps.nightly.outputs.package_name }}
      should_build: ${{ steps.nightly.outputs.should_build }}
    steps:
      - name: Fetch trusted resolver
        env:
          RESOLVER_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          resolver_dir="$RUNNER_TEMP/linux-arm64-nightly-resolver"
          base_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${RESOLVER_REF}/.github/scripts"
          mkdir -p "$resolver_dir"
          curl --proto '=https' --tlsv1.2 --retry 3 -fsSLo \
            "$resolver_dir/linux-arm64-nightly.cjs" \
            "$base_url/linux-arm64-nightly.cjs"
          curl --proto '=https' --tlsv1.2 --retry 3 -fsSLo \
            "$resolver_dir/linux-arm64-nightly.test.cjs" \
            "$base_url/linux-arm64-nightly.test.cjs"
          curl --proto '=https' --tlsv1.2 --retry 3 -fsSLo \
            "$resolver_dir/linux-arm64-arch-repo.cjs" \
            "$base_url/linux-arm64-arch-repo.cjs"
          curl --proto '=https' --tlsv1.2 --retry 3 -fsSLo \
            "$resolver_dir/linux-arm64-arch-repo.test.cjs" \
            "$base_url/linux-arm64-arch-repo.test.cjs"

      - name: Test nightly automation scripts
        run: |
          node --test \
            "$RUNNER_TEMP/linux-arm64-nightly-resolver/linux-arm64-nightly.test.cjs" \
            "$RUNNER_TEMP/linux-arm64-nightly-resolver/linux-arm64-arch-repo.test.cjs"

      - id: nightly
        name: Select newest unbuilt upstream nightly
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/linux-arm64-nightly-resolver/linux-arm64-nightly.cjs"

  build:
    name: Build Linux ARM64 AppImage
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
    container:
      image: node:24.13.1-trixie
    env:
      CI: "1"
      DEBIAN_FRONTEND: noninteractive
      SHELL: /bin/bash
      UPSTREAM_TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      ARTIFACT_NAME: ${{ needs.resolve.outputs.artifact_name }}
      ARCH_PKGVER: ${{ needs.resolve.outputs.arch_pkgver }}
      PACKAGE_NAME: ${{ needs.resolve.outputs.package_name }}
      PAGES_BASE_URL: https://t3-repo.sppidy.in
    outputs:
      upstream_commit: ${{ steps.package.outputs.upstream_commit }}
    steps:
      - name: Install container build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(dpkg --print-architecture)" = arm64
          test "$(node -p 'process.arch')" = arm64
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            dbus-x11 \
            fakeroot \
            file \
            git \
            imagemagick \
            libarchive-tools \
            libasound2 \
            libfuse2 \
            libgbm1 \
            libgtk-3-0 \
            libnss3 \
            libsecret-1-0 \
            libudev-dev \
            libx11-xcb1 \
            libxss1 \
            libsecret-1-dev \
            makepkg \
            pacman-package-manager \
            passwd \
            pkg-config \
            python3 \
            util-linux \
            zstd \
            xvfb
          rm -rf /var/lib/apt/lists/*

      - name: Fetch trusted Arch packaging inputs
        shell: bash
        env:
          BUILD_INPUT_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          input_dir="$RUNNER_TEMP/linux-arm64-nightly-inputs"
          raw_base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${BUILD_INPUT_REF}"
          mkdir -p "$input_dir"
          curl --proto '=https' --tlsv1.2 --retry 3 -fsSLo \
            "$input_dir/PKGBUILD" \
            "$raw_base/packaging/arch-arm64/PKGBUILD"
          curl --proto '=https' --tlsv1.2 --retry 3 -fsSLo \
            "$input_dir/linux-arm64-arch-repo.cjs" \
            "$raw_base/.github/scripts/linux-arm64-arch-repo.cjs"

      - name: Clone exact upstream nightly
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$UPSTREAM_TAG" --single-branch \
            https://github.com/pingdotgg/t3code.git .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git tag --points-at HEAD | grep -Fx "$UPSTREAM_TAG")" = "$UPSTREAM_TAG"

      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          printf '%s\n' "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustc" --version
          "$HOME/.cargo/bin/cargo" --version

      - name: Install Vite+
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://vite.plus | bash
          printf '%s\n' "$HOME/.local/share/vite-plus/bin" >> "$GITHUB_PATH"
          "$HOME/.local/share/vite-plus/bin/vp" --version

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "$VERSION"

      - name: Build ARM64 AppImage
        run: |
          vp run dist:desktop:artifact \
            --platform linux \
            --target AppImage \
            --arch arm64 \
            --build-version "$VERSION" \
            --output-dir "$GITHUB_WORKSPACE/release" \
            --verbose

      - id: package
        name: Verify and package build output
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=(release/*.AppImage)
          test "${#appimages[@]}" -eq 1
          appimage="${appimages[0]}"
          test "$(basename "$appimage")" = "$ARTIFACT_NAME"
          file "$appimage" | grep -F 'ARM aarch64'

          appimage_path="$(realpath "$appimage")"
          verification_dir="$RUNNER_TEMP/t3code-appimage-verification"
          mkdir -p "$verification_dir"
          cd "$verification_dir"
          "$appimage_path" --appimage-extract >/dev/null
          find squashfs-root -type f -exec file {} + > elf-files.txt
          awk '
            /:[[:space:]]+ELF / {
              seen++
              if ($0 !~ /ARM aarch64/) {
                print "Wrong-architecture payload: " $0 > "/dev/stderr"
                bad++
              }
            }
            END {
              printf "Verified %d ARM64 ELF payloads\n", seen
              if (seen == 0 || bad > 0) exit 1
            }
          ' elf-files.txt

          cd "$GITHUB_WORKSPACE"
          upstream_commit="$(git rev-parse HEAD)"
          test "$(git tag --points-at HEAD | grep -Fx "$UPSTREAM_TAG")" = "$UPSTREAM_TAG"
          mkdir -p publish
          mv "$appimage" "publish/$ARTIFACT_NAME"
          (
            cd publish
            sha256sum "$ARTIFACT_NAME" > "$ARTIFACT_NAME.sha256"
          )
          printf 'upstream_repository=pingdotgg/t3code\nupstream_tag=%s\nupstream_commit=%s\nversion=%s\nbuild_arch=arm64\narch_pkgver=%s\narch_package=%s\ncontainer=node:24.13.1-trixie\n' \
            "$UPSTREAM_TAG" "$upstream_commit" "$VERSION" "$ARCH_PKGVER" "$PACKAGE_NAME" \
            > publish/BUILD-PROVENANCE.txt
          printf 'upstream_commit=%s\n' "$upstream_commit" >> "$GITHUB_OUTPUT"

      - name: Build and verify Arch ARM64 package
        shell: bash
        run: |
          set -euo pipefail
          package_work_dir="$RUNNER_TEMP/t3code-arch-package"
          license_name="t3code-nightly-bin-${ARCH_PKGVER}-LICENSE"
          mkdir -p "$package_work_dir"
          cp "$RUNNER_TEMP/linux-arm64-nightly-inputs/PKGBUILD" \
            "$package_work_dir/PKGBUILD"
          cp "publish/$ARTIFACT_NAME" "$package_work_dir/$ARTIFACT_NAME"
          cp LICENSE "$package_work_dir/$license_name"

          appimage_sha256="$(sha256sum "$package_work_dir/$ARTIFACT_NAME" | awk '{print $1}')"
          license_sha256="$(sha256sum "$package_work_dir/$license_name" | awk '{print $1}')"
          useradd --create-home --shell /bin/bash package-builder
          chown -R package-builder:package-builder "$package_work_dir"
          # PACKAGE_WORK_DIR is expanded by the unprivileged child shell.
          # shellcheck disable=SC2016
          runuser --user package-builder -- env \
            PACKAGE_WORK_DIR="$package_work_dir" \
            T3CODE_ARCH_PKGVER="$ARCH_PKGVER" \
            T3CODE_ARTIFACT_NAME="$ARTIFACT_NAME" \
            T3CODE_APPIMAGE_SHA256="$appimage_sha256" \
            T3CODE_LICENSE_SHA256="$license_sha256" \
            PKGEXT='.pkg.tar.zst' \
            bash -c 'cd "$PACKAGE_WORK_DIR" && makepkg --cleanbuild --force --nodeps --noconfirm'

          shopt -s nullglob
          packages=("$package_work_dir"/*.pkg.tar.zst)
          test "${#packages[@]}" -eq 1
          package_path="${packages[0]}"
          test "$(basename "$package_path")" = "$PACKAGE_NAME"

          package_info="$RUNNER_TEMP/t3code-package-info.txt"
          bsdtar -xOf "$package_path" .PKGINFO > "$package_info"
          grep -Fx 'pkgname = t3code-nightly-bin' "$package_info"
          grep -Fx "pkgver = ${ARCH_PKGVER}-1" "$package_info"
          grep -Fx 'arch = aarch64' "$package_info"
          bsdtar -tvf "$package_path" \
            | awk '
                $1 == "-rwsr-xr-x" &&
                $NF == "opt/t3code-nightly-bin/chrome-sandbox" { found = 1 }
                END { if (!found) exit 1 }
              '

          package_verify_dir="$RUNNER_TEMP/t3code-package-verification"
          mkdir -p "$package_verify_dir"
          bsdtar -xf "$package_path" -C "$package_verify_dir"
          test -f "$package_verify_dir/.BUILDINFO"
          test -f "$package_verify_dir/.MTREE"
          test -f "$package_verify_dir/.PKGINFO"
          test -x "$package_verify_dir/opt/t3code-nightly-bin/AppRun"
          test -x "$package_verify_dir/usr/bin/t3code-nightly"
          test -L "$package_verify_dir/usr/bin/t3-code-nightly-desktop"
          test -f "$package_verify_dir/usr/share/applications/t3code.desktop"

          find "$package_verify_dir/opt/t3code-nightly-bin" -type f -exec file {} + \
            > "$RUNNER_TEMP/t3code-package-elf-files.txt"
          awk '
            /:[[:space:]]+ELF / {
              seen++
              if ($0 !~ /ARM aarch64/) {
                print "Wrong-architecture package payload: " $0 > "/dev/stderr"
                bad++
              }
            }
            END {
              printf "Verified %d packaged ARM64 ELF payloads\n", seen
              if (seen == 0 || bad > 0) exit 1
            }
          ' "$RUNNER_TEMP/t3code-package-elf-files.txt"

          mv "$package_path" "publish/$PACKAGE_NAME"
          (
            cd publish
            sha256sum "$PACKAGE_NAME" > "$PACKAGE_NAME.sha256"
          )

      - name: Build and verify pacman repository
        shell: bash
        run: |
          set -euo pipefail
          repository_site="$GITHUB_WORKSPACE/repository-site"
          architecture_dir="$repository_site/aarch64"
          mkdir -p "$architecture_dir"
          cp "publish/$PACKAGE_NAME" "publish/$PACKAGE_NAME.sha256" "$architecture_dir/"
          (
            cd "$architecture_dir"
            repo-add t3code-arm64.db.tar.zst "$PACKAGE_NAME"
          )

          repository_desc_entry="$(
            bsdtar -tf "$architecture_dir/t3code-arm64.db.tar.zst" \
              | awk '/\/desc$/ { print }'
          )"
          test "$(printf '%s\n' "$repository_desc_entry" | wc -l)" -eq 1
          bsdtar -xOf "$architecture_dir/t3code-arm64.db.tar.zst" \
            "$repository_desc_entry" > "$RUNNER_TEMP/t3code-repository-desc.txt"
          awk -v filename="$PACKAGE_NAME" -v version="${ARCH_PKGVER}-1" '
            $0 == "%FILENAME%" { getline; found_filename = ($0 == filename) }
            $0 == "%NAME%" { getline; found_name = ($0 == "t3code-nightly-bin") }
            $0 == "%VERSION%" { getline; found_version = ($0 == version) }
            $0 == "%ARCH%" { getline; found_arch = ($0 == "aarch64") }
            END {
              if (!found_filename || !found_name || !found_version || !found_arch) exit 1
            }
          ' "$RUNNER_TEMP/t3code-repository-desc.txt"

          REPOSITORY_SITE_DIR="$repository_site" \
            node "$RUNNER_TEMP/linux-arm64-nightly-inputs/linux-arm64-arch-repo.cjs"
          (
            cd "$architecture_dir"
            sha256sum -c "$PACKAGE_NAME.sha256"
          )
          cmp "$architecture_dir/t3code-arm64.db" \
            "$architecture_dir/t3code-arm64.db.tar.zst"
          cmp "$architecture_dir/t3code-arm64.files" \
            "$architecture_dir/t3code-arm64.files.tar.zst"
          test -z "$(find "$repository_site" -type l -print -quit)"
          test -z "$(find "$repository_site" -type f -links +1 -print -quit)"
          test "$(find "$repository_site" -type f | wc -l)" -eq 8

      - name: Upload verified build artifact
        uses: actions/upload-artifact@v7
        with:
          name: t3-code-linux-arm64-${{ needs.resolve.outputs.version }}
          path: publish/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload verified pacman repository artifact
        uses: actions/upload-artifact@v7
        with:
          name: t3-code-arch-repository-${{ needs.resolve.outputs.version }}
          path: repository-site
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish fork prerelease
    needs: [resolve, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@v8
        with:
          name: t3-code-linux-arm64-${{ needs.resolve.outputs.version }}
          path: dist

      - name: Recheck artifact boundary
        env:
          ARTIFACT_NAME: ${{ needs.resolve.outputs.artifact_name }}
          ARCH_PKGVER: ${{ needs.resolve.outputs.arch_pkgver }}
          PACKAGE_NAME: ${{ needs.resolve.outputs.package_name }}
          UPSTREAM_TAG: ${{ needs.resolve.outputs.tag }}
          UPSTREAM_COMMIT: ${{ needs.build.outputs.upstream_commit }}
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 5
          test -f "dist/$ARTIFACT_NAME"
          test -f "dist/$ARTIFACT_NAME.sha256"
          test -f "dist/$PACKAGE_NAME"
          test -f "dist/$PACKAGE_NAME.sha256"
          test -f dist/BUILD-PROVENANCE.txt
          (cd dist && sha256sum -c "$ARTIFACT_NAME.sha256")
          (cd dist && sha256sum -c "$PACKAGE_NAME.sha256")
          grep -Fx "upstream_tag=$UPSTREAM_TAG" dist/BUILD-PROVENANCE.txt
          grep -Fx "upstream_commit=$UPSTREAM_COMMIT" dist/BUILD-PROVENANCE.txt
          grep -Fx "arch_pkgver=$ARCH_PKGVER" dist/BUILD-PROVENANCE.txt
          grep -Fx "arch_package=$PACKAGE_NAME" dist/BUILD-PROVENANCE.txt

      - name: Create or repair fork prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          UPSTREAM_TAG: ${{ needs.resolve.outputs.tag }}
          UPSTREAM_COMMIT: ${{ needs.build.outputs.upstream_commit }}
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/release-notes.md"
          printf 'Automated native Linux ARM64 build of [%s](https://github.com/pingdotgg/t3code/releases/tag/%s) at commit [%s](https://github.com/pingdotgg/t3code/commit/%s).\n\nBuilt on GitHub-hosted ARM64 using the containerized Node 24/Trixie toolchain. The AppImage, Arch package, checksums, and build provenance are attached. The rolling unsigned pacman repository is published through this fork\x27s GitHub Pages site.\n' \
            "$UPSTREAM_TAG" "$UPSTREAM_TAG" "$UPSTREAM_COMMIT" "$UPSTREAM_COMMIT" \
            > "$notes_file"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "T3 Code Linux ARM64 $VERSION" \
              --notes-file "$notes_file" \
              --prerelease
          fi

  pages:
    name: Publish Arch repository on Pages
    needs: [resolve, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download verified pacman repository artifact
        uses: actions/download-artifact@v8
        with:
          name: t3-code-arch-repository-${{ needs.resolve.outputs.version }}
          path: site

      - name: Recheck Pages artifact boundary
        env:
          PACKAGE_NAME: ${{ needs.resolve.outputs.package_name }}
        run: |
          set -euo pipefail
          test "$(find site -type f | wc -l)" -eq 8
          test -z "$(find site -type l -print -quit)"
          test -z "$(find site -type f -links +1 -print -quit)"
          test -f site/index.html
          test -f site/aarch64/index.html
          test -f "site/aarch64/$PACKAGE_NAME"
          test -f "site/aarch64/$PACKAGE_NAME.sha256"
          test -f site/aarch64/t3code-arm64.db.tar.zst
          test -f site/aarch64/t3code-arm64.files.tar.zst
          cmp site/aarch64/t3code-arm64.db \
            site/aarch64/t3code-arm64.db.tar.zst
          cmp site/aarch64/t3code-arm64.files \
            site/aarch64/t3code-arm64.files.tar.zst
          (cd site/aarch64 && sha256sum -c "$PACKAGE_NAME.sha256")

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deployment
        name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
